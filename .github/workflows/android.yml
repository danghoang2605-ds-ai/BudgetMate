name: Android CI
on:
  push:
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      # API keys are optional for CI: the app falls back to sample data without them.
      - name: Unit tests (JVM + Robolectric Room tests)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Room schema is committed
        run: |
          # A schema change without a committed schema file means an unreviewed migration.
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git status --porcelain app/schemas
            git diff -- app/schemas || true
            echo "::error::Room schema changed: commit the exported file in app/schemas and add a Migration"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: budgetmate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm test
        working-directory: proxy
