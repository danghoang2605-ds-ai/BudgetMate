name: Website
# Builds site/ plus WebP copies of the CI screenshots and deploys them to GitHub Pages.
on:
  push:
    branches: [master]
    paths: ["site/**", "docs/screenshots/**", "scripts/build-site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Separate jobs: deploy-pages in the upload job sometimes cannot see the fresh artifact yet.
  build:
    runs-on: ubuntu-latest
    steps:
      # The workflow token cannot switch Pages on; a repo admin has to do it once.
      - name: Check that GitHub Pages is on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type); then
            echo "::error title=GitHub Pages is off::Open Settings > Pages, set Source to 'GitHub Actions', then run this workflow again."
            exit 1
          fi
          echo "Pages build_type: ${build_type}"
          # 'legacy' = "Deploy from a branch": GitHub would publish README.md over this site.
          if [ "${build_type}" != "workflow" ]; then
            echo "::error title=Pages publishes from a branch::Open Settings > Pages and change Source from 'Deploy from a branch' to 'GitHub Actions', then run this workflow again."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/build-site.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
